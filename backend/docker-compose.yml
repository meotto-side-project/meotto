# docker-compose.yml

services:
  app:
    image: ${DOCKER_IMAGE:-reyang/meotto-api:latest}
    container_name: meotto-api
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      RELATION_DATABASE_HOST: mysql
      RELATION_DATABASE_PORT: 3306
      RELATION_DATABASE_USERNAME: ${RELATION_DATABASE_USERNAME:-meotto}
      RELATION_DATABASE_PASSWORD: ${RELATION_DATABASE_PASSWORD:-meotto1234}
      RELATION_DATABASE_DATABASE: ${RELATION_DATABASE_DATABASE:-meotto}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-true}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  mysql:
    image: mysql:8.0
    container_name: meotto-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${RELATION_DATABASE_PASSWORD:-meotto1234}
      MYSQL_DATABASE: ${RELATION_DATABASE_DATABASE:-meotto}
      MYSQL_USER: ${RELATION_DATABASE_USERNAME:-meotto}
      MYSQL_PASSWORD: ${RELATION_DATABASE_PASSWORD:-meotto1234}
    ports:
      - "${RELATION_DATABASE_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meotto-redis
    ports:
      - "${REDIS_PORT:-6378}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
