name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew .githooks/commit-msg

      - name: Validate commit messages
        run: |
          BASE_SHA="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          STATUS=0
          for sha in $(git log --no-merges --format=%H "$BASE_SHA..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg-check.txt
            if ! ./.githooks/commit-msg /tmp/commit-msg-check.txt; then
              echo "::error::커밋 ${sha} 메시지가 컨벤션을 위반했습니다"
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Checkstyle
        run: ./gradlew checkstyleMain --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
